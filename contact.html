<script>
    document.querySelectorAll('.nav-dropdown > a').forEach(trigger => {
        trigger.addEventListener('click', e => {
            if (window.innerWidth < 768) { e.preventDefault(); trigger.parentElement.classList.toggle('open'); }
        });
    });
    document.addEventListener('click', e => {
        document.querySelectorAll('.nav-dropdown.open').forEach(d => { if (!d.contains(e.target)) d.classList.remove('open'); });
    });
</script>
